[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyagent"
version = "0.2.0"
description = "Multi-provider AI agent framework combining local + free-tier models, with honest money-making workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
saas = ["fastapi>=0.110", "uvicorn>=0.29", "stripe>=7.0"]
trading = ["yfinance>=0.2.40"]
dev = ["pytest>=7.0", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
moneyagent = "moneyagent.__main__:main"

[tool.setuptools.packages.find]
include = ["moneyagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # line length handled by formatter; B008 = FastAPI Depends() default
